<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/icons/favicon.png" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <title>Mealie Mixer</title>
  <link rel="stylesheet" href="/style.css" />
  <script defer src="/app.js"></script>
  <script defer src="/vendor/alpine.min.js"></script>
</head>
<body>
<div id="app" x-data="mixer()" x-init="init()" x-cloak>

  <header class="topbar">
    <button class="brand brandbtn" @click="goHome()" title="Home"><img src="/icons/brand.png" class="brandlogo" alt="" />Mealie&nbsp;Mixer</button>
    <button class="iconbtn" x-show="['input','review','done','history','settings','cookbook-upload','cookbook','cookbook-progress','cookbook-review'].includes(view)"
            @click="menuOpen = true" title="Menu">☰</button>
  </header>

  <main class="wrap">

    <!-- cookbook job banner (close & come back) -->
    <button class="cbbanner" x-show="cookbookJob && !['cookbook-progress','cookbook-review'].includes(view)" x-cloak
            @click="openCookbookJob()"
            x-text="cookbookJob && cookbookJob.status === 'done'
              ? ('📚 Cookbook ready — ' + (cookbookJob.total - cookbookJob.failed) + ' to review →')
              : ('📚 Cookbook processing… ' + (cookbookJob ? cookbookJob.done : 0) + ' / ' + (cookbookJob ? cookbookJob.total : 0))"></button>

    <!-- gate / loading -->
    <template x-if="view === 'gate'">
      <div class="center muted"><div class="spinner"></div><p>Loading…</p></div>
    </template>

    <!-- login -->
    <template x-if="view === 'login'">
      <div class="card">
        <h2>Sign in</h2>
        <input class="input" type="text" placeholder="Username" x-model="loginUser" @keydown.enter="doLogin()" />
        <input class="input" type="password" placeholder="Password" x-model="loginPass" @keydown.enter="doLogin()" />
        <button class="btn primary" :disabled="loading" @click="doLogin()">Log in</button>
        <p class="err" x-show="error" x-text="error"></p>
      </div>
    </template>

    <!-- setup / settings (shared config form) -->
    <template x-if="view === 'setup' || view === 'settings'">
      <div class="card">
        <h2 x-text="view === 'setup' ? 'First-time setup' : 'Settings'"></h2>
        <p class="muted small" x-show="view === 'setup'">Enter your Mealie + AI details to get started.</p>

        <h3>Mealie</h3>
        <input class="input" type="text" placeholder="Mealie URL (http://host:9925)" x-model="cfg.mealie_url" />
        <small class="warn" x-show="pinned('MEALIE_URL')">⚠ set by an env var — Settings won't change it</small>
        <input class="input" type="password" x-model="cfg.mealie_token"
               :placeholder="secretPh('MEALIE')" />
        <small class="warn" x-show="pinned('MEALIE_TOKEN')">⚠ token set by an env var</small>
        <button class="btn ghost sm" @click="testMealie()">Test Mealie</button>
        <small :class="mealieTest.ok ? 'ok' : 'err'" x-text="mealieTest.msg"></small>

        <h3>AI backend</h3>
        <input class="input" type="password" x-model="cfg.ai_key" :placeholder="secretPh('AI')" />
        <small class="warn" x-show="pinned('AI_API_KEY')">⚠ AI key set by an env var</small>
        <input class="input" type="text" placeholder="AI base URL" x-model="cfg.ai_base" />
        <input class="input" type="text" placeholder="AI model" x-model="cfg.ai_model" />
        <input class="input" type="number" min="0" placeholder="AI requests/min limit (0 or blank = no limit)" x-model="cfg.ai_rpm" />
        <small class="muted small">Caps how fast bulk imports (e.g. a cookbook) call the AI — set it below your provider's per-minute limit if you hit rate errors.</small>
        <small class="warn" x-show="pinned('AI_RPM_LIMIT')">⚠ rate limit set by an env var</small>
        <button class="btn ghost sm" @click="testAi()">Test AI (≈1 token)</button>
        <small :class="aiTest.ok ? 'ok' : 'err'" x-text="aiTest.msg"></small>

        <h3>Login (optional)</h3>
        <input class="input" type="text" placeholder="Username (blank = no login)" x-model="cfg.auth_user" />
        <input class="input" type="password" placeholder="Password (blank = keep)" x-model="cfg.auth_pass" />

        <h3>Agent API key (optional)</h3>
        <input class="input" type="password" x-model="cfg.api_key" :placeholder="secretPh('MIXER_API')" />
        <small class="warn" x-show="pinned('MIXER_API_KEY')">⚠ API key set by an env var</small>
        <button class="btn ghost sm" @click="genKey()">🎲 Generate key</button>
        <small class="mono" x-show="genKeyMsg" x-text="genKeyMsg"></small>

        <template x-if="view === 'settings'">
          <div>
            <h3>Voice notes</h3>
            <small class="ok" x-show="cfgInfo.voice">🎤 Enabled in this build — record or upload a voice note on the import screen.</small>
            <small class="muted small" x-show="!cfgInfo.voice">Not included in this build (it pulls in a large local transcription model). To turn it on, rebuild the image with <span class="mono">WITH_VOICE=1</span> — e.g. <span class="mono">WITH_VOICE=1 docker compose build</span> (Docker), or <span class="mono">--build-arg WITH_VOICE=1</span> (Podman). The 🎤 controls appear automatically once it's built in.</small>
          </div>
        </template>

        <button class="btn primary" :disabled="loading" @click="saveConfig()"
                x-text="view === 'setup' ? 'Save & start' : 'Save settings'"></button>
        <p class="muted small" x-show="cfgMsg" x-text="cfgMsg"></p>
        <p class="err" x-show="error" x-text="error"></p>

        <div class="row" x-show="view === 'settings'">
          <button class="btn ghost" @click="afterAuth()">← Back</button>
          <button class="btn ghost" x-show="cfgInfo.login_required" @click="logout()">Log out</button>
        </div>
      </div>
    </template>

    <!-- input -->
    <template x-if="view === 'input'">
      <div class="card">
        <h2>Add a recipe</h2>
        <p class="muted small">📚 Whole cookbook or a multi-recipe PDF? <button type="button" class="linkbtn" @click="openCookbook()">Use Cookbook import</button> (in the ☰ menu) for much better results.</p>
        <label class="filezone">
          <input type="file" accept="image/*,.pdf,.md,.markdown,.txt,.eml" multiple
                 @change="fileList = $event.target.files" />
          <span x-text="fileList && fileList.length
                  ? (fileList.length + ' file(s) selected')
                  : '📷 Photo, screenshot(s), or a PDF / .md / .txt / .eml'"></span>
        </label>
        <div class="or">— or —</div>
        <input class="input" type="url" placeholder="paste a recipe link" x-model="url" />
        <small class="warn" x-show="importedNote()" x-text="importedNote()"></small>
        <small class="muted small" x-show="socialUrl()">ℹ We'll read the post's caption. If the recipe is only spoken/shown in the video (not written in the caption), screenshot the post and share the image instead.</small>
        <div class="or">— or —</div>
        <textarea class="input" rows="4" placeholder="…or paste recipe text" x-model="pastedText"></textarea>
        <template x-if="cfgInfo.voice">
          <div class="voicebox">
            <div class="or">— or —</div>
            <div class="row">
              <button type="button" class="btn ghost" :class="{ recpulse: recording }" @click="toggleRecord()"
                      x-text="recording ? ('⏹ Stop · ' + recClock()) : '🎤 Record a voice note'"></button>
              <label class="btn ghost filebtn">📁 Upload audio
                <input type="file" accept="audio/*" @change="pickAudio($event)" />
              </label>
            </div>
            <div class="audiorow" x-show="audioBlob && !recording">
              <audio class="audioprev" :src="audioUrl" controls></audio>
              <button type="button" class="x" @click="clearAudio()" title="remove">✕</button>
            </div>
            <small class="muted small">Read the recipe aloud — ingredients with their amounts, then the steps.</small>
          </div>
        </template>
        <div class="row">
          <select class="input" x-model="language">
            <template x-for="l in languages" :key="l"><option x-text="l"></option></template>
          </select>
          <input class="input" type="text" placeholder="extra note (optional)" x-model="prompt" />
        </div>
        <button class="btn primary" :disabled="loading || (!fileList?.length && !url.trim() && !pastedText.trim() && !audioBlob)"
                @click="extract()">Extract recipe</button>
        <p class="err" x-show="error" x-text="error"></p>
      </div>
    </template>

    <!-- review / edit -->
    <template x-if="view === 'review'">
      <div class="card" @input.debounce.400ms="saveSession()">
        <p class="muted small" x-show="queue.length" x-text="queue.length + ' more queued'"></p>
        <img class="hero" x-show="photoPreview || recipe.image_url" :src="photoPreview || recipe.image_url" alt="" />
        <div class="photorow">
          <label class="photopick">
            <input type="file" accept="image/*" @change="pickPhoto($event)" />
            <span x-text="(photoFile || recipe.image_url) ? '📷 Tap to change the photo' : '📷 Add a dish photo (optional)'"></span>
          </label>
          <button class="x" x-show="photoFile || recipe.image_url" @click="removePhoto()" title="remove photo">✕</button>
        </div>
        <small class="warn" x-show="autoPhotoWarn()">⚠ Auto-grabbed from the post — check it's the dish, or remove it.</small>
        <template x-if="sourceImages.length">
          <div class="sourcebox">
            <p class="muted small">Source screenshot — tap to zoom &amp; compare</p>
            <div class="sourcestrip">
              <template x-for="(s, i) in sourceImages" :key="i">
                <img class="sourcethumb" :src="s" @click="zoomSrc = s" alt="source" />
              </template>
            </div>
          </div>
        </template>
        <input class="input title" placeholder="Recipe name" x-model="recipe.name" />
        <small class="warn" x-show="nameExists()">⚠ A recipe with this name already exists in Mealie — pushing makes a separate copy.</small>
        <textarea class="input" rows="2" placeholder="Description" x-model="recipe.description"></textarea>
        <div class="row">
          <label class="field"><span>Servings</span>
            <input class="input" type="number" min="0" x-model="recipe.servings" /></label>
          <label class="field"><span>Yield</span>
            <input class="input" type="text" x-model="recipe.yield" /></label>
        </div>
        <h3>Categories</h3>
        <div class="chips">
          <template x-for="(c, i) in recipe.categories" :key="i">
            <span class="chip"><span x-text="c"></span><button class="cx" @click="removeCategory(i)" title="remove">✕</button></span>
          </template>
        </div>
        <input class="input" type="text" placeholder="add a category" list="categories-list"
               x-model="categoryInput" @change="addCategory()" @keydown.enter.prevent="addCategory()" />
        <h3>Ingredients</h3>
        <div class="ings">
          <template x-for="(ing, i) in recipe.ingredients" :key="i">
            <div class="ingwrap">
              <input class="input section" x-show="ing.title" placeholder="section heading" x-model="ing.title" />
              <div class="ing">
                <input class="input qty" placeholder="qty" x-model="ing.quantity" />
                <input class="input unit" placeholder="unit" x-model="ing.unit" />
                <input class="input food" placeholder="food" list="foods-list" x-model="ing.food"
                       :class="ing.food &amp;&amp; ing.food.trim() ? 'fs-' + foodStatus(ing.food) : ''"
                       :title="{exists:'Already in Mealie',near:'Near-match exists in Mealie',new:'New — will be created'}[foodStatus(ing.food)] || ''" />
                <input class="input note" placeholder="note" x-model="ing.note" />
                <button class="x" @click="recipe.ingredients.splice(i,1)" title="remove">✕</button>
              </div>
              <div class="rowactions">
                <button class="foodhint" type="button" x-show="nearestFood(ing.food)"
                        @click="ing.food = nearestFood(ing.food)"
                        x-text="'↳ use ' + nearestFood(ing.food) + ' instead?'"></button>
                <button class="foodhint" type="button" x-show="!ing.title"
                        @click="ing.title = 'Section'">§ section</button>
              </div>
            </div>
          </template>
        </div>
        <button class="btn ghost" @click="addIngredient()">+ add ingredient</button>
        <p class="legend">🟢 in Mealie · 🟡 near-match · 🔵 new food</p>
        <h3>Instructions</h3>
        <textarea class="input" rows="7" placeholder="one step per line" x-model="instructionsText"></textarea>
        <h3>Notes</h3>
        <div class="notes">
          <template x-for="(n, i) in recipe.notes" :key="i">
            <div class="notewrap">
              <div class="noterow">
                <input class="input" placeholder="note title (optional)" x-model="n.title" />
                <button class="x" @click="removeNote(i)" title="remove">✕</button>
              </div>
              <textarea class="input" rows="2" placeholder="tip — storage, substitutions, make-ahead…" x-model="n.text"></textarea>
            </div>
          </template>
        </div>
        <button class="btn ghost" @click="addNote()">+ add note</button>
        <p class="err" x-show="error" x-text="error"></p>
      </div>
    </template>

    <!-- done -->
    <template x-if="view === 'done'">
      <div class="card center">
        <div class="big">✅</div>
        <h2 x-text="'Saved: ' + lastName"></h2>
        <a class="btn" :href="lastUrl" target="_blank">Open in Mealie ↗</a>
        <button class="btn ghost" @click="reset()">Add another</button>
      </div>
    </template>

    <!-- history -->
    <template x-if="view === 'history'">
      <div class="card">
        <h2>Import history</h2>
        <p class="muted small" x-show="!history.length">Nothing imported yet.</p>
        <div class="histlist">
          <template x-for="(h, i) in history" :key="i">
            <div class="histitem">
              <div class="histrow">
                <button class="histtoggle" @click="toggleHist(h)" x-text="expandedId === h.id ? '▾' : '▸'"></button>
                <a class="histname" :class="{ histdiscarded: h.status === 'discarded' }"
                   :href="h.status === 'discarded' ? null : h.mealie_url"
                   :target="h.status === 'discarded' ? null : '_blank'"
                   x-text="h.name || '(untitled)'"></a>
                <div class="histmeta">
                  <span class="histbadge" x-show="h.status === 'discarded'">discarded</span>
                  <span x-text="(h.created_at || '').slice(0,10)"></span>
                  <span class="histsrc" x-show="h.source_url" x-text="histHost(h.source_url)"></span>
                  <button class="histrestore" x-show="h.status === 'discarded'" @click="restoreImport(h)">↩ restore</button>
                </div>
              </div>
              <div class="histpreview" x-show="expandedId === h.id" x-cloak>
                <p class="muted small" x-show="(payloads[h.id]||{}).servings || (payloads[h.id]||{}).yield"
                   x-text="'Serves ' + ((payloads[h.id]||{}).servings || '?') + ((payloads[h.id]||{}).yield ? ' · ' + payloads[h.id].yield : '')"></p>
                <ul class="prevings">
                  <template x-for="(ing, k) in ((payloads[h.id]||{}).ingredients || [])" :key="k">
                    <li x-text="ingLine(ing)"></li>
                  </template>
                </ul>
                <p class="muted small" x-show="((payloads[h.id]||{}).instructions || []).length"
                   x-text="((payloads[h.id]||{}).instructions || []).length + ' step(s)'"></p>
                <p class="muted small" x-show="payloads[h.id] && !((payloads[h.id]||{}).ingredients || []).length">No recipe details stored for this entry.</p>
              </div>
            </div>
          </template>
        </div>
        <button class="btn ghost" @click="view = 'input'">← Back</button>
      </div>
    </template>

    <!-- cookbook: upload -->
    <template x-if="view === 'cookbook-upload'">
      <div class="card">
        <h2>📚 Cookbook import</h2>
        <p class="muted small">Upload a recipe-book PDF — it finds each recipe (with its photo), you pick which to import, the AI structures them, then you review and push the lot. Best for text-based (not scanned) PDFs.</p>
        <label class="filezone cookbookzone">
          <input type="file" accept=".pdf,application/pdf" @change="pickCookbook($event)" />
          <span>📚 Choose a cookbook PDF</span>
        </label>
        <p class="err" x-show="error" x-text="error"></p>
        <button class="btn ghost" @click="view = 'input'">← Back</button>
      </div>
    </template>

    <!-- cookbook: pick recipes -->
    <template x-if="view === 'cookbook'">
      <div class="card">
        <h2>Cookbook — pick recipes</h2>
        <p class="muted small"><span x-text="cbRecipes.length"></span> found · <span x-text="cbSelCount()"></span> selected</p>
        <div class="row">
          <button class="btn ghost" @click="cbToggleAll(true)">Select all</button>
          <button class="btn ghost" @click="cbToggleAll(false)">None</button>
        </div>
        <div class="cblist">
          <template x-for="(r, i) in cbRecipes" :key="i">
            <label class="cbrow">
              <input type="checkbox" x-model="r.sel" />
              <img class="cbthumb" :src="r.image" x-show="r.image" alt="" />
              <div class="cbthumb cbnoimg" x-show="!r.image">🍽</div>
              <div class="cbmeta">
                <span class="cbtitle" x-text="r.title"></span>
                <span class="warn small" x-show="cbImported(r.title)">already imported</span>
              </div>
            </label>
          </template>
        </div>
        <p class="err" x-show="error" x-text="error"></p>
        <div class="row">
          <button class="btn ghost" @click="reset()">Cancel</button>
          <button class="btn primary" :disabled="!cbSelCount()" @click="cbStructure()" x-text="'Structure ' + cbSelCount() + ' →'"></button>
        </div>
      </div>
    </template>

    <!-- cookbook: processing (server-side background job) -->
    <template x-if="view === 'cookbook-progress'">
      <div class="card center">
        <div class="spinner big"></div>
        <h2>Structuring your cookbook…</h2>
        <p class="muted" x-text="(cookbookJob ? cookbookJob.done : 0) + ' / ' + (cookbookJob ? cookbookJob.total : 0) + ' done' + (cookbookJob && cookbookJob.failed ? ' · ' + cookbookJob.failed + ' failed' : '')"></p>
        <div class="cbbar"><div class="cbbar-fill" :style="'width:' + (cookbookJob && cookbookJob.total ? Math.round(100 * cookbookJob.done / cookbookJob.total) : 0) + '%'"></div></div>
        <p class="muted small">This runs on the server — you can close this tab and come back; it'll be waiting for you (☰ → Cookbook, or the banner up top).</p>
        <div class="row">
          <button class="btn ghost" @click="cbCancel()">⊘ Stop</button>
          <button class="btn ghost" @click="view = 'input'">Leave it running</button>
        </div>
      </div>
    </template>

    <!-- cookbook: bulk review + push -->
    <template x-if="view === 'cookbook-review'">
      <div class="card">
        <h2>Review &amp; push</h2>
        <p class="muted small"><span x-text="cbStructured.length"></span> structured · <span x-text="cbPushCount()"></span> selected</p>
        <div class="cblist">
          <template x-for="(s, i) in cbStructured" :key="i">
            <div class="cbitem">
              <div class="cbrow">
                <input type="checkbox" x-model="s.sel" @change="cbSaveReview()" />
                <button class="histtoggle" @click="cbToggleRow(i)" x-text="cbExpanded === i ? '▾' : '▸'"></button>
                <img class="cbthumb" :src="s.image" x-show="s.image" alt="" />
                <div class="cbthumb cbnoimg" x-show="!s.image">🍽</div>
                <div class="cbmeta">
                  <span class="cbtitle" x-text="s.recipe.name || '(untitled)'"></span>
                  <span class="muted small" x-text="(s.recipe.ingredients||[]).length + ' ingredients · ' + (s.recipe.instructions||[]).length + ' steps'"></span>
                  <div class="cbbadges">
                    <span class="badge dup" x-show="cbNameExists(s.recipe.name)">already in Mealie</span>
                    <span class="badge near" x-show="cbNearFoods(s.recipe)" x-text="'⚠ ' + cbNearFoods(s.recipe) + ' near-match food' + (cbNearFoods(s.recipe) > 1 ? 's' : '') + ' — edit to tidy'"></span>
                  </div>
                </div>
                <button class="histrestore" @click="cbEditOne(i)">edit</button>
                <button class="x" @click="cbRemove(i)" title="remove">✕</button>
              </div>
              <div class="histpreview" x-show="cbExpanded === i" x-cloak>
                <p class="muted small" x-show="s.recipe.servings || s.recipe.yield"
                   x-text="'Serves ' + (s.recipe.servings || '?') + (s.recipe.yield ? ' · ' + s.recipe.yield : '')"></p>
                <ul class="prevings">
                  <template x-for="(ing, k) in (s.recipe.ingredients||[])" :key="k"><li x-text="ingLine(ing)"></li></template>
                </ul>
                <ol class="prevsteps">
                  <template x-for="(st, k) in (s.recipe.instructions||[])" :key="k"><li x-text="st"></li></template>
                </ol>
                <template x-for="(n, k) in (s.recipe.notes||[])" :key="k">
                  <p class="muted small" x-text="'📝 ' + (n.title ? n.title + ': ' : '') + n.text"></p>
                </template>
              </div>
            </div>
          </template>
        </div>
        <p class="err" x-show="error" x-text="error"></p>
        <div class="row">
          <button class="btn ghost" @click="cbDiscardReview()">Discard all</button>
          <button class="btn primary" :disabled="!cbPushCount()" @click="cbPushAll()" x-text="'Push ' + cbPushCount() + ' to Mealie'"></button>
        </div>
      </div>
    </template>
  </main>

  <footer class="actionbar" x-show="view === 'review'">
    <button class="btn ghost" x-show="cbEditIndex === null" @click="discard()" x-text="queue.length ? 'Discard this' : 'Discard'"></button>
    <button class="btn primary" x-show="cbEditIndex === null" :disabled="loading" @click="push()">✅ Approve &amp; push</button>
    <button class="btn ghost" x-show="cbEditIndex !== null" @click="cbCancelEdit()">← Discard edits</button>
    <button class="btn primary" x-show="cbEditIndex !== null" @click="cbSaveEdit()">Save &amp; back</button>
  </footer>

  <!-- side menu (hamburger) -->
  <div class="drawer-backdrop" x-show="menuOpen" @click="menuOpen = false" x-transition.opacity x-cloak></div>
  <nav class="drawer" :class="{ open: menuOpen }" x-cloak>
    <div class="drawer-head">
      <span class="brand">🍲&nbsp;Menu</span>
      <button class="iconbtn" @click="menuOpen = false" title="Close">✕</button>
    </div>
    <button class="drawer-item" @click="openCookbook()">📚 <span>Cookbook import</span>
      <span class="menudot" x-show="cookbookJob" x-cloak x-text="cookbookJob && cookbookJob.status === 'done' ? 'ready' : 'running'"></span></button>
    <button class="drawer-item" @click="openHistory()">🕘 <span>Import history</span></button>
    <button class="drawer-item" @click="openSettings()">⚙️ <span>Settings</span></button>
    <button class="drawer-item" x-show="cfgInfo.login_required" @click="menuOpen = false; logout()">🚪 <span>Log out</span></button>
  </nav>

  <div class="overlay" x-show="loading" x-transition.opacity x-cloak>
    <div class="spinner big"></div><p x-text="loadingMsg"></p>
    <div class="cbbar" x-show="audioProgress > 0" x-cloak style="max-width:240px">
      <div class="cbbar-fill" :style="'width:' + Math.round(audioProgress * 100) + '%'"></div>
    </div>
  </div>
  <div class="toast" x-show="toast" x-text="toast" x-transition></div>

  <div class="zoom" x-show="zoomSrc" @click="zoomSrc = ''" x-transition.opacity x-cloak>
    <img :src="zoomSrc" alt="" />
  </div>

  <div class="modal" x-show="dupModal" @click.self="cancelDup()" x-transition.opacity x-cloak>
    <div class="modalbox">
      <h2>⚠ Already in Mealie</h2>
      <p>A recipe named “<strong x-text="recipe.name"></strong>” already exists. Pushing will create a <em>separate copy</em> (Mealie won't overwrite the original).</p>
      <div class="row">
        <button class="btn ghost" @click="cancelDup()">Cancel</button>
        <button class="btn primary" @click="confirmDup()">Push anyway</button>
      </div>
    </div>
  </div>

  <datalist id="foods-list">
    <template x-for="f in foods" :key="f"><option :value="f"></option></template>
  </datalist>
  <datalist id="categories-list">
    <template x-for="c in categories" :key="c"><option :value="c"></option></template>
  </datalist>
</div>

<script>
  // PWA: register the service worker (best-effort)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
